<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Notch diagnostic</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 15px/1.5 -apple-system, system-ui, sans-serif;
    background: #fff;
    overflow-x: clip;
    padding-top: var(--cover-h, 0px);
  }

  /* The white cover bar. Its height is driven by --cover-h, which the mode
     buttons rewrite, so we can compare candidate fixes without redeploying. */
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--cover-h, 0px);
    background: #fff;
    z-index: 5000;
    pointer-events: none;
  }

  .nav {
    position: sticky; top: var(--cover-h, 0px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e6e9ef;
  }
  .logo { font-size: 1.4rem; font-weight: 700; color: #3B82F6; letter-spacing: -.03em; }

  /* Loud stripes: if ANY of this is visible up in the notch, bleed-through. */
  .stripes {
    height: 150vh;
    background: repeating-linear-gradient(45deg,
      #ff00a0 0 28px, #00e0ff 28px 56px, #ffd400 56px 84px);
  }

  .panel { padding: 20px; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .modes button {
    flex: 1 1 auto; padding: 14px 10px; font: 600 15px/1 inherit;
    border: 2px solid #3B82F6; background: #fff; color: #3B82F6; border-radius: 10px;
  }
  .modes button[aria-pressed="true"] { background: #3B82F6; color: #fff; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 4px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
  td:first-child { color: #64748b; white-space: nowrap; padding-right: 12px; }
  td:last-child { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; word-break: break-word; }
  .hero { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; text-align: center; margin: 4px 0 2px; }
  .hero small { display: block; font-size: .8rem; font-weight: 600; color: #64748b; letter-spacing: 0; }
  .ua { font-size: 11px; color: #94a3b8; word-break: break-all; margin-top: 14px; }
  #probe { height: env(safe-area-inset-top, 0px); }
</style>
</head>
<body>
<div id="probe"></div>

<nav class="nav"><span class="logo">cirqle</span><span>diagnostic</span></nav>

<div class="panel">
  <p class="hero"><span id="envBig">?</span>px<small>env(safe-area-inset-top)</small></p>

  <div class="modes">
    <button data-mode="off">Off</button>
    <button data-mode="env" aria-pressed="true">env()</button>
    <button data-mode="fixed">60px</button>
    <button data-mode="js">JS</button>
  </div>
  <p style="margin-bottom:18px;color:#64748b">
    Tap each mode, then scroll the stripes past the notch. Screenshot whichever
    one keeps the notch solid white.
  </p>

  <table><tbody id="out"></tbody></table>
  <p class="ua" id="ua"></p>
</div>

<div class="stripes"></div>

<script>
  var probe = document.getElementById('probe');
  var nav = document.querySelector('.nav');
  var out = document.getElementById('out');

  function envPx() { return probe.getBoundingClientRect().height; }

  function setMode(mode) {
    var h = '0px';
    if (mode === 'env') h = 'env(safe-area-inset-top, 0px)';
    else if (mode === 'fixed') h = '60px';
    else if (mode === 'js') h = (window.screen.height - window.innerHeight > 0 ? 47 : 47) + 'px';
    document.body.style.setProperty('--cover-h', h);
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
    report();
  }

  document.querySelectorAll('.modes button').forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  function report() {
    var vv = window.visualViewport || {};
    var rows = [
      ['env(safe-area-inset-top)', envPx() + 'px'],
      ['nav rect .top', nav.getBoundingClientRect().top.toFixed(1) + 'px'],
      ['window.innerHeight', window.innerHeight],
      ['screen.height', window.screen.height],
      ['edge-to-edge?', window.innerHeight >= window.screen.height ? 'YES' : 'no'],
      ['visualViewport.height', vv.height ? vv.height.toFixed(1) : 'n/a'],
      ['visualViewport.offsetTop', vv.offsetTop != null ? vv.offsetTop.toFixed(1) : 'n/a'],
      ['visualViewport.pageTop', vv.pageTop != null ? vv.pageTop.toFixed(1) : 'n/a'],
      ['scrollY', Math.round(window.scrollY)],
      ['devicePixelRatio', window.devicePixelRatio],
      ['standalone', String(window.navigator.standalone)],
      ['build', 'notch-test-1']
    ];
    out.innerHTML = rows.map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');
    document.getElementById('envBig').textContent = envPx().toFixed(1);
  }

  addEventListener('scroll', report, { passive: true });
  addEventListener('resize', report);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', report);
    visualViewport.addEventListener('scroll', report);
  }
  document.getElementById('ua').textContent = navigator.userAgent;
  setMode('env');
</script>
</body>
</html>
