<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23437D9E' stroke-width='12'/%3E%3C/svg%3E" />
  <title>Confirm Email — Cirqle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/cirqle.css?v=8" />
  <style>
    main {
      position: relative; z-index: 1;
      min-height: calc(100vh - 70px);
      display: flex; align-items: center; justify-content: center;
      padding: clamp(36px, 6vw, 64px) clamp(20px, 4vw, 44px) 70px;
      max-width: 1140px; margin: 0 auto;
    }
    .auth-card { width: 100%; max-width: 460px; padding: 36px; text-align: center; }
    .card-title { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.02em; margin-bottom: 8px; }
    .card-sub { font-size: .88rem; font-weight: 500; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.65; }
    .state-icon { font-size: 2.6rem; line-height: 1; margin-bottom: 14px; }
    .btn-submit { width: 100%; font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; }
    .spinner {
      width: 34px; height: 34px; margin: 6px auto 18px;
      border: 3px solid var(--ink); border-top-color: transparent;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .resend-row { margin-top: 18px; font-size: .84rem; font-weight: 600; color: var(--ink-soft); }
    .resend-row a { color: var(--pink-deep); font-weight: 800; text-decoration: none; cursor: pointer; }
    .resend-row a:hover { text-decoration: underline; }
    .field { text-align: left; }
    .note { font-size: .8rem; color: var(--ink-soft); margin-top: 14px; line-height: 1.55; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="logo">cirqle</a>
    <a href="signin.html" class="btn btn-sm btn-lime">Sign in</a>
  </nav>

  <main>
    <div class="card auth-card">

      <!-- ── Working ── -->
      <div id="loadingPanel">
        <div class="spinner"></div>
        <div class="card-title">Confirming your email…</div>
        <div class="card-sub">One moment.</div>
      </div>

      <!-- ── Confirmed ── -->
      <div id="okPanel" style="display:none">
        <div class="state-icon">✓</div>
        <div class="card-title" id="okTitle">Email confirmed</div>
        <div class="card-sub" id="okMsg"></div>
        <a href="signin.html" class="btn btn-lime btn-submit" style="display:block;text-align:center;text-decoration:none">Go to sign in →</a>
      </div>

      <!-- ── Bad or expired link: offer a fresh one ── -->
      <div id="badPanel" style="display:none">
        <div class="state-icon">⏳</div>
        <div class="card-title">This link has expired</div>
        <div class="card-sub" id="badMsg">Confirmation links last 24 hours. Enter your email and we'll send a new one.</div>

        <form id="resendForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="ico ico-mail ico-soft"></i></span>
              <input type="email" id="email" placeholder="alex@example.com" autocomplete="email" />
            </div>
            <div class="field-error" id="emailErr">Please enter a valid email address.</div>
          </div>
          <button type="submit" class="btn btn-lime btn-submit" id="resendBtn">
            <span id="resendText">Send a new link</span>
          </button>
        </form>
        <div class="note" id="resendNote"></div>
      </div>

    </div>
  </main>

  <script src="assets/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token  = params.get('token') || '';
    // The email-change link carries &change=1 — a different endpoint, because
    // it swaps the account's address rather than confirming the original one.
    const isChange = params.get('change') === '1';
    const endpoint = isChange ? '/auth/confirm-email-change' : '/auth/verify-email';

    const show = id => {
      ['loadingPanel','okPanel','badPanel'].forEach(p => {
        document.getElementById(p).style.display = p === id ? 'block' : 'none';
      });
    };

    async function verify() {
      if (!token) {
        document.getElementById('badMsg').textContent =
          'This link is missing its code. Open it straight from your email, or send yourself a new one.';
        show('badPanel');
        return;
      }
      try {
        const res = await fetch(`${window.CIRQLE_API_BASE}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (res.ok) {
          const body = await res.json().catch(() => ({}));
          document.getElementById('okTitle').textContent =
            isChange ? 'Email address updated' : 'Email confirmed';
          document.getElementById('okMsg').textContent =
            body.message || 'All done.';
          show('okPanel');
          return;
        }
        if (res.status === 409) {
          const body = await res.json().catch(() => ({}));
          document.getElementById('badMsg').textContent =
            body.detail || 'That email address is already in use.';
          show('badPanel');
          return;
        }
        show('badPanel');
      } catch (err) {
        document.getElementById('badMsg').textContent =
          'Could not reach the server. Check your connection and try the link again.';
        show('badPanel');
      }
    }
    verify();

    // ── Resend ──
    document.getElementById('resendForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const ok = email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      document.getElementById('email').classList.toggle('error', !ok);
      document.getElementById('emailErr').classList.toggle('visible', !ok);
      if (!ok) return;

      const btn = document.getElementById('resendBtn');
      btn.disabled = true;
      document.getElementById('resendText').textContent = 'Sending…';
      try {
        const res = await fetch(`${window.CIRQLE_API_BASE}/auth/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const body = await res.json().catch(() => ({}));
        document.getElementById('resendNote').textContent =
          body.message || "If that address has an account, we've sent a new link.";
        document.getElementById('resendText').textContent = 'Sent ✓';
      } catch (err) {
        btn.disabled = false;
        document.getElementById('resendText').textContent = 'Send a new link';
        document.getElementById('resendNote').textContent =
          'Could not reach the server. Please try again.';
      }
    });
  </script>
  <script src="assets/enhance.js"></script>
</body>
</html>
